<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #060913;
            overflow: hidden;
            position: relative;
        }

        /* Premium Dynamic Background Mesh */
        .bg-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: floatBackground 15s infinite alternate ease-in-out;
        }
        .glow-1 { width: 450px; height: 450px; background: #ff007f; top: -10%; left: -10%; }
        .glow-2 { width: 550px; height: 550px; background: #7928ca; bottom: -20%; right: -10%; animation-delay: -4s; }
        .glow-3 { width: 350px; height: 350px; background: #00dfd8; top: 35%; left: 75%; animation-delay: -7s; }

        /* Ultra-Attractive Welcome/Autoplay Overlay */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #060913;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .welcome-screen.hide {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-100%);
        }
        .welcome-box {
            text-align: center;
            animation: pulseGlow 2s infinite alternate;
        }
        .welcome-title {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .enter-btn {
            background: linear-gradient(135deg, #00dfd8 0%, #7928ca 100%);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 223, 216, 0.4);
            transition: all 0.4s ease;
        }
        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(121, 40, 202, 0.7);
        }

        /* Music Floating Controller */
        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 30px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .music-control:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* 3D Glassmorphism Luxury Card */
        .card {
            position: relative;
            width: 420px;
            padding: 50px 35px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15);
            z-index: 1;
            transform-style: preserve-3d;
            perspective: 1000px;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, opacity 1s, border-color 0.3s;
        }
        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 40px 80px rgba(255, 0, 127, 0.15), 0 30px 60px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Image Luxury Glow Frame */
        .profile-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 35px;
        }
        .profile-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            border-radius: 50%;
            z-index: -1;
            animation: spinGlow 4s linear infinite;
        }
        .profile-wrapper::after {
            content: '';
            position: absolute;
            inset: -12px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            border-radius: 50%;
            z-index: -2;
            filter: blur(25px);
            opacity: 0.65;
            animation: spinGlow 4s linear infinite;
        }
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #060913;
            background: #121026;
        }

        /* Luxury Typography */
        h1 {
            font-size: 2.4rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .gradient-text {
            background: linear-gradient(45deg, #ff416c, #ff4b2b, #a855f7, #00dfd8);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 5s ease infinite;
        }
        p {
            color: #cbd5e1;
            font-size: 1.02rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Luxury Celebrate Button */
        .btn {
            position: relative;
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(255, 0, 127, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px rgba(255, 0, 127, 0.6);
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes spinGlow { 100% { transform: rotate(360deg); } }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatBackground {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        /* Confetti Overlay Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-box">
            <h2 class="welcome-title">Someone Special Has a Birthday! 🤫</h2>
            <button class="enter-btn" onclick="initiateCelebration()">Open Surprise ✨</button>
        </div>
    </div>

    <div class="bg-mesh">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>
        <div class="glow-circle glow-3"></div>
    </div>

    <div class="music-control" onclick="toggleMusic()">
        <span id="music-icon">⏸️</span> <span id="music-text">Pause Music</span>
    </div>

    <audio id="bgSong" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <canvas id="confetti"></canvas>

    <div class="card" id="birthdayCard">
        <div class="profile-wrapper">
            <img src="image.jpg" alt="Birthday Friend" class="profile-pic">
        </div>
        <h1>Happy Birthday, <br><span class="gradient-text">shami!</span> 🎉</h1>
        <p>Wishing you a day filled with laughter, premium vibes, and success in everything you execute. May this upcoming year unlock massive milestones for you!</p>
        <button class="btn" onclick="triggerConfetti()">Celebrate! ✨</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const audio = document.getElementById('bgSong');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const birthdayCard = document.getElementById('birthdayCard');
        const musicText = document.getElementById('music-text');
        const musicIcon = document.getElementById('music-icon');

        // 🔥 Jaise hi user "Open Surprise" dabayega, Audio AUTO chalegi aur card reveal hoga!
        function initiateCelebration() {
            welcomeScreen.classList.add('hide');
            birthdayCard.classList.add('show');
            
            // Auto play audio forcefully after interaction
            audio.play().catch(err => {
                console.log("Autoplay failed setup, fallback active: ", err);
            });

            // Auto trigger magical burst
            setTimeout(triggerConfetti, 500);
        }

        function triggerConfetti() {
            let duration = 3.5 * 1000;
            let end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 0.85 },
                    colors: ['#ff007f', '#7928ca', '#00dfd8', '#ff4b2b']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 0.85 },
                    colors: ['#ff007f', '#7928ca', '#00dfd8', '#ff4b2b']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Manual Controller Settings
        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                musicText.innerText = "Pause Music";
                musicIcon.innerText = "⏸️";
            } else {
                audio.pause();
                musicText.innerText = "Play Music";
                musicIcon.innerText = "🎵";
            }
        }
    </script>
</body>
</html>
