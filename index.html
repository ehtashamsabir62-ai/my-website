<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Interactive Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080c09;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Glow Mesh */
        .bg-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.55;
            animation: floatBackground 12s infinite alternate ease-in-out;
        }
        .glow-1 { width: 450px; height: 450px; background: #e11d48; top: -10%; left: -10%; }
        .glow-2 { width: 550px; height: 550px; background: #16a34a; bottom: -20%; right: -10%; animation-delay: -4s; }
        .glow-3 { width: 350px; height: 350px; background: #22c55e; top: 35%; left: 75%; animation-delay: -7s; }

        /* Welcome Screen */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #080c09;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .welcome-screen.hide {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-100%);
        }
        .welcome-box {
            text-align: center;
            animation: pulseGlow 2s infinite alternate;
            padding: 0 20px;
        }
        .welcome-title {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .enter-btn {
            background: linear-gradient(135deg, #e11d48 0%, #16a34a 100%);
            color: #fff;
            border: none;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.5);
            transition: all 0.4s ease;
        }
        .enter-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(22, 163, 74, 0.8);
        }

        /* Music Floating Controller */
        .music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 18px;
            border-radius: 30px;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .music-control:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            width: 420px;
            padding: 50px 35px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
            z-index: 1;
            transform-style: preserve-3d;
            perspective: 1000px;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, opacity 1s, border-color 0.3s;
        }
        .card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 40px 80px rgba(22, 163, 74, 0.25), 0 30px 60px rgba(0, 0, 0, 0.7);
            border-color: rgba(225, 29, 72, 0.4);
        }

        /* Profile Glow Ring */
        .profile-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 35px;
        }
        .profile-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, #e11d48, #22c55e, #dc2626, #16a34a);
            border-radius: 50%;
            z-index: -1;
            animation: spinGlow 4s linear infinite;
        }
        .profile-wrapper::after {
            content: '';
            position: absolute;
            inset: -12px;
            background: linear-gradient(45deg, #e11d48, #22c55e);
            border-radius: 50%;
            z-index: -2;
            filter: blur(25px);
            opacity: 0.7;
            animation: spinGlow 4s linear infinite;
        }
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #080c09;
            background: #111827;
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .gradient-text {
            background: linear-gradient(45deg, #f43f5e, #22c55e, #ef4444, #4ade80);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease infinite;
        }
        .dots {
            white-space: nowrap;
        }

        /* Call Badge Styling */
        .call-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(225, 29, 72, 0.25), rgba(22, 163, 74, 0.25));
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.3);
            animation: pulseGlow 2s infinite alternate;
        }
        .call-badge span {
            color: #4ade80;
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }

        p {
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* Celebrate Button */
        .btn {
            position: relative;
            background: linear-gradient(135deg, #e11d48 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(225, 29, 72, 0.4);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 35px rgba(22, 163, 74, 0.6);
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes spinGlow { 100% { transform: rotate(360deg); } }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatBackground {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-box">
            <h2 class="welcome-title">Welcome to the World of Passion & Determination! ✨🔥</h2>
            <button class="enter-btn" onclick="initiateCelebration()">Click Here For Surprise! 🎁🔥</button>
        </div>
    </div>

    <div class="bg-mesh">
        <div class="glow-circle glow-1"></div>
        <div class="glow-circle glow-2"></div>
        <div class="glow-circle glow-3"></div>
    </div>

    <div class="music-control" onclick="toggleMusic()">
        <span id="music-icon">⏸️</span> <span id="music-text">Pause Music</span>
    </div>

    <audio id="bgSong" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <canvas id="confetti"></canvas>

    <div class="card" id="birthdayCard">
        <div class="profile-wrapper">
            <img src="image.png" alt="Profile Image" class="profile-pic">
        </div>
        <h1><span class="gradient-text">I'm Ehtasham</span> <span class="dots">🔴🟢</span></h1>
        
        <!-- Highlighted Date Call -->
        <div class="call-badge">
            📢 Final Call: <span>27th September</span> 🔴🟢
        </div>

        <p>Standing firm with truth, courage, and pride! Imran Khan is a great leader whose vision inspires millions. Mera junoon, meri pehchan — Insaf aur haq ki awaz! 🔴🟢🔥</p>
        <button class="btn" onclick="triggerConfetti()">Celebrate Hope! ✨</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        const audio = document.getElementById('bgSong');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const birthdayCard = document.getElementById('birthdayCard');
        const musicText = document.getElementById('music-text');
        const musicIcon = document.getElementById('music-icon');

        function initiateCelebration() {
            welcomeScreen.classList.add('hide');
            birthdayCard.classList.add('show');
            
            audio.play().catch(err => {
                console.log("Audio play deferred: ", err);
            });

            setTimeout(triggerConfetti, 400);
        }

        function triggerConfetti() {
            let duration = 3.5 * 1000;
            let end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 65,
                    origin: { x: 0, y: 0.85 },
                    colors: ['#e11d48', '#16a34a', '#ffffff', '#22c55e', '#dc2626']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 65,
                    origin: { x: 1, y: 0.85 },
                    colors: ['#e11d48', '#16a34a', '#ffffff', '#22c55e', '#dc2626']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function toggleMusic() {
            if (audio.paused) {
                audio.play();
                musicText.innerText = "Pause Music";
                musicIcon.innerText = "⏸️";
            } else {
                audio.pause();
                musicText.innerText = "Play Music";
                musicIcon.innerText = "🎵";
            }
        }
    </script>
</body>
</html>
